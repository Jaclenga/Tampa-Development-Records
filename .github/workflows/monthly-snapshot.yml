name: Month-end Tampa snapshot

on:
  schedule:
    # GitHub cron has no "last day of month" expression. Run on candidate
    # dates, then let the first step continue only on Tampa's month-end.
    # 12:17 UTC is 07:17 EST / 08:17 EDT. This leaves at least 15 hours
    # before Tampa midnight if GitHub starts a scheduled job late.
    - cron: "17 12 28-31 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-tampa-snapshot
  cancel-in-progress: false

jobs:
  collect-compare-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm Tampa month-end
        id: month_end
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual collection requested; preserving the actual observation date."
            exit 0
          fi

          tampa_today="$(TZ=America/New_York date +%F)"
          tampa_month="$(TZ=America/New_York date +%m)"
          tampa_tomorrow_month="$(TZ=America/New_York date -d tomorrow +%m)"
          echo "expected_date=$tampa_today" >> "$GITHUB_OUTPUT"

          if [ "$tampa_month" = "$tampa_tomorrow_month" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "$tampa_today is not Tampa's last calendar day; no collection needed."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "$tampa_today is Tampa month-end; collection will run."
          fi

      - name: Check out the repository
        if: steps.month_end.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip an already archived scheduled observation
        if: steps.month_end.outputs.should_run == 'true'
        id: existing_snapshot
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.month_end.outputs.expected_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            existing="$(python -c 'import json, os; index = json.load(open("data/monthly_changes/index.json", encoding="utf-8")); print(any(item["snapshot_date"] == os.environ["EXPECTED_DATE"] for item in index["snapshots"]))')"
            if [ "$existing" = "True" ]; then
              echo "should_collect=false" >> "$GITHUB_OUTPUT"
              echo "$EXPECTED_DATE is already archived; no collection needed."
              exit 0
            fi
          fi
          echo "should_collect=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Collect and compare the bounded source snapshot
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        run: python scripts/snapshot_tracker.py collect-live

      - name: Verify the scheduled observation stayed on month-end
        if: steps.existing_snapshot.outputs.should_collect == 'true' && github.event_name == 'schedule'
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.month_end.outputs.expected_date }}
        run: |
          actual_date="$(python -c 'import json; print(json.load(open("data/monthly_changes/index.json"))["snapshots"][-1]["snapshot_date"])')"
          if [ "$actual_date" != "$EXPECTED_DATE" ]; then
            echo "::error::Collection crossed the date boundary: expected $EXPECTED_DATE, got $actual_date. Nothing will be committed."
            exit 1
          fi

      - name: Run the complete test suite
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        run: python -m pytest -q

      - name: Reject workstation paths and private author emails
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        run: python scripts/check_repository_privacy.py

      - name: Reject malformed diffs
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        run: git diff --check

      - name: Commit the new snapshot and comparison
        if: steps.existing_snapshot.outputs.should_collect == 'true'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No published source changes to commit."
            exit 0
          fi
          snapshot_date="$(python -c 'import json; print(json.load(open("data/monthly_changes/index.json"))["snapshots"][-1]["snapshot_date"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: add Tampa snapshot ${snapshot_date}"
          git push
