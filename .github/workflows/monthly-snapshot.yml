name: Month-end Tampa snapshot

on:
  schedule:
    # Retry on month-end; days 1-2 recover checkpoints without backdating.
    - cron: "17 12,18,22 28-31,1-2 * *"
  workflow_dispatch:
    inputs:
      observation_date:
        description: "Optional YYYY-MM-DD to recover; past dates require checkpoints"
        type: string
        default: ""
      backup_run_id:
        description: "Optional failed run whose fallback artifact should be imported"
        type: string
        default: ""
      verify_only:
        description: "Run recovery failure drills without collection or publication"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-tampa-snapshot
  cancel-in-progress: false

jobs:
  recovery-drills:
    if: inputs.verify_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  capture:
    if: inputs.verify_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      date: ${{ steps.gate.outputs.target_date }}
      ready: ${{ steps.acquire.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies, report builders, or unrelated tests before capture.
      - name: Select observation or recovery date
        id: gate
        env:
          REQUESTED_DATE: ${{ inputs.observation_date }}
        run: python scripts/snapshot_pipeline.py plan --event "$GITHUB_EVENT_NAME" --date "$REQUESTED_DATE"
      - name: Download optional fallback backup
        if: steps.gate.outputs.should_run == 'true' && inputs.backup_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.backup_run_id }}
          name: tampa-capture-${{ inputs.backup_run_id }}
          path: .cache/import-backup
      - name: Validate and import fallback checkpoints
        if: steps.gate.outputs.should_run == 'true' && inputs.backup_run_id != ''
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
        run: python scripts/snapshot_pipeline.py import-backup --date "$TARGET_DATE" --directory .cache/import-backup
      - name: Acquire or resume durable source checkpoints
        id: acquire
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          ALLOW_LIVE: ${{ steps.gate.outputs.allow_live }}
        shell: bash
        run: |
          options=()
          if [ "$ALLOW_LIVE" = "true" ]; then options+=(--allow-live); fi
          python scripts/snapshot_pipeline.py capture --date "$TARGET_DATE" --directory .cache/capture-backup "${options[@]}"
      - name: Save independent fallback, including partial captures
        id: backup
        if: always() && steps.acquire.outcome != 'skipped' && steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tampa-capture-${{ github.run_id }}
          path: .cache/capture-backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Report capture durability
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          TARGET_DATE: ${{ steps.gate.outputs.target_date }}
          CAPTURE: ${{ steps.acquire.outcome }}
          BACKUP: ${{ steps.backup.outcome }}
        run: |
          echo "## Tampa observation $TARGET_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Durable capture: $CAPTURE; fallback artifact: $BACKUP." >> "$GITHUB_STEP_SUMMARY"
          echo "Recovery branch: snapshot-captures/$TARGET_DATE. Partial captures are not published snapshots." >> "$GITHUB_STEP_SUMMARY"
          if [ "$BACKUP" != "success" ]; then echo "::warning::Fallback artifact unavailable; check durable branch."; fi
          if [ "$CAPTURE" != "success" ]; then
            echo "::error::Capture incomplete. Retry on the observation day, or recover saved checkpoints."
            exit 1
          fi

  validate-and-publish:
    needs: capture
    if: needs.capture.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore verified capture before installing test dependencies
        env:
          TARGET_DATE: ${{ needs.capture.outputs.date }}
        run: python scripts/snapshot_pipeline.py restore --date "$TARGET_DATE" --directory data/snapshots
      - name: Build derived outputs from saved data only
        env:
          TARGET_DATE: ${{ needs.capture.outputs.date }}
        run: python scripts/snapshot_tracker.py update --source "data/snapshots/$TARGET_DATE/source_records.csv.gz"
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run the complete test suite
        run: python -m pytest -q
      - name: Check privacy and diff integrity
        run: |
          python scripts/check_repository_privacy.py
          git diff --check
      - name: Publish only validated generated outputs
        env:
          TARGET_DATE: ${{ needs.capture.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/monthly_changes data/monthly_events data/planned_events data/processed/activity_by_month.csv reports/changes reports/dashboard manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "data: add Tampa snapshot ${TARGET_DATE}"
          # A concurrent main update is left for the next run to rebuild;
          # never overwrite main or blindly rebase generated outputs.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Explain publication failure
        if: failure()
        env:
          TARGET_DATE: ${{ needs.capture.outputs.date }}
        run: |
          echo "::error::Publication failed; capture retained on snapshot-captures/$TARGET_DATE."
          echo "Recover without live queries: dispatch this workflow with observation_date=$TARGET_DATE." >> "$GITHUB_STEP_SUMMARY"
